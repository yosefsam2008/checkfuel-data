name: Auto Update Fuel Prices

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch: 

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install axios cheerio

      - name: Run Scraper
        run: node updatePrices.js

      - name: Commit and Push
        run: |
          git config --global user.name "CheckFuel Auto-Bot"
          git config --global user.email "bot@checkfuel.app"
          git add public/prices.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Auto-update fuel prices"
          git push
